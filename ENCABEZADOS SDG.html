<!DOCTYPE html> <!-- indica que el documento usa el estandar html5 -->
<html lang="en"> <!--  define el documento en el idioma español -->

    <title>Encabezados HTML</title> <!-- establece el titulo de la pagina como es encabezados html -->
</head>

<body> <!-- es el cuerpo de la pagina que contiene el contenido principal de todo lo visible en la pagina -->
   
    <h1>Titulo 1</h1> <!-- es el titulo mas importante de todos -->

    <h4>Titulo 4</h4> <!-- van disminuyendo confomre se necesite o sea de menor importancia -->
    <h5>Titulo 5</h5>

</body>

</html>
