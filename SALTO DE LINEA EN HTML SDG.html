<!DOCTYPE html> <!-- indica que el documento usa el estandar html5 -->
<html lang="en"> <!--  define el documento en el idioma español -->


<head> <!-- son los datos de la pagina quye no se ven directamente pero son importantes comopara definir el ombre de la pagina -->
    <meta charset="UTF-8"> <!--  es una "codificacion" de caracteres se debe de usar para que la pagina sea capas de interpretar y mostrar el texto , esto evita errores al usar letras con acetos o con ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- el "name="viewport" le indica al navegador que las instrucciones de "content" van a lo que se puede visaulisar de la pantalla, ademas de establecer las medidas -->
    <title>Salto de linea en HTML</title> <!-- establece el titulo de la pagina, en este caso salto de linea html-->
</head>

<body> <!-- es el cuerpo de la pagina que contiene el contenido principal de todo lo visible en la pagina -->
    <h1>Lenguaje de programacion</h1>  <!-- el h1 es el titulo mas importante de la pagina -->
    <p>En la actualidad se utilizan diferentes <!-- es el parrafo, donde se muestra el texto -->
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!-- el br sirve para insertar un salto de linea entre texto -->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
</body>

</html>
