<!DOCTYPE html> <!-- indica que el documento usa el estandar html5 -->
<html lang="en"> <!--  define el documento en el idioma español -->

<head> <!-- son los datos de la pagina quye no se ven directamente pero son importantes comopara definir el ombre de la pagina -->
    <meta charset="UTF-8"> <!--  es una "codificacion" de caracteres se debe de usar paras que la pagina sea capas de interpretar y mostrar el texto , esto evita errores al usar letras con acetos o con ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title> <!-- establece el titulo de la pagina en estwe cso es el de imagenes en html-->
</head>

<body> <!-- es el cuerpo de la pagina que contiene el contenido principal de todo lo visible en la pagina -->
    <h2>Imagenes en HTML</h2> <!-- ese el subtitulo´principal  --> 
    <h3>Locales</h3> <!-- ese el subtitulo secundario --> 
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- el img sirve para insertar imagenes --> 
    <h3>Locales redismensionado</h3> 
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- el src es de la ruta de donde se va a agarrar la imagen --> 
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"  alt=""> <!-- el width es para definir el ancho de la imagen y height es para definir la altura de la imagen, el alt es para poner una descripcion de la imagen --> 
    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>
</html>
